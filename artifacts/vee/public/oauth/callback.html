<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vee - Signing in...</title>
<style>
body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #fff; }
.msg { text-align: center; color: #333; }
</style>
</head>
<body>
<div class="msg"><p>Signing you in to Vee...</p></div>
<script>
// Google puts the id_token in the URL fragment (#id_token=...)
// Extract it and deep-link back to the app
var hash = window.location.hash.substring(1);
var params = new URLSearchParams(hash);
var idToken = params.get('id_token');
var error = params.get('error');
if (idToken) {
  window.location.href = 'vee://oauth?id_token=' + encodeURIComponent(idToken);
} else if (error) {
  window.location.href = 'vee://oauth?error=' + encodeURIComponent(error);
} else {
  document.querySelector('.msg').innerHTML = '<p>Sign-in failed. Please close this and try again.</p>';
}
</script>
</body>
</html>
